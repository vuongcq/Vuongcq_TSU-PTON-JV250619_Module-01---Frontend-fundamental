<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h4{
            background-color: rgb(223, 106, 64);
            color: aliceblue;
            padding-left: 100px;
        }
        .name{
            color: blue;
        }
        .email{
            color: blue;
            padding-left: 25px;
        }
        .sothich{
            color: blue;
            padding-left: 10px;
        }
        .chitiet{
            color: orange;
            padding-left: 0px;
        }
        .chitiet1{
            color: orange;
            padding-left: 67px;
        }
        .chitiet2{
            color: orange;
            padding-left: 67px;
        }
        .button{
            padding-left: 60px;
        }
    </style>
</head>
<body>
    <form action="http://www.myserver.com" method="post">
        <h4>SỞ THÍCH CỦA BẠN</h4>
        <p class="name">
            <label for="name">Họ và tên</label>
            <input type="text" name="name">
        </p>
        <p class="email">
            <label for="email">Email</label>
            <input type="email" name="Email">
        </p>
        <p>
            <span class="sothich">
                <label for="hobbies">Sở thích</label>
            </span>
            <span class="chitiet">
                <input type="checkbox" name="hobbies"/>
                <label for="Thể thao">Thể thao</label>
                <input type="checkbox" name="hobbies"/>
                <label for="Âm nhạc">Âm nhạc</label>
                <input type="checkbox" name="hobbies"/>
                <label for="Đọc sách">Đọc sách</label>
            </span>
            <br>
            <span class="chitiet1">
                <input type="checkbox" name="hobbies"/>
                <label for="Lướt web">Lướt web</label>
                <input type="checkbox" name="hobbies"/>
                <label for="Chơi game">Chơi game</label>
                <input type="checkbox" name="hobbies"/>
                <label for="Điện ảnh">Điện ảnh</label>
            </span class>
            <br>    
            <span class="chitiet2">
                <input type="checkbox" name="hobbies"/>
                <label for="Du lịch">Du lịch</label>   
            </span>
         </p>      
        
        <p class="button">
            <button>Gửi thông tin</button>
            <button type="reset">Nhập lại</button>
        </p>
        
    </form>
</body>
</html>
