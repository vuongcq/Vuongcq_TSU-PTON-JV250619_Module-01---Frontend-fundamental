<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
table, th, td {
  padding: 10px;
  border-collapse: collapse;
  text-align : center
}
#anh1{
  border-radius: 25px;
}
#anh2{
  border-radius: 25px;
}
#anh3{
  border-radius: 25px;
}
h1 {
  text-indent: 200px;
}

</style>

</head>
<body>
    <!-- Bài1: Tạo bảng có chưa thông tin sản phẩm trong cửa hàng của bạn -->
    <H1><em>My Store</em></H1>
    <table border="1" >
        <tr>
            <th>Item Photo</th>
            <th>Name</th>
            <th>Price</th>
        </tr>
        <tr>
            <td><img id="anh1" width="60%" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTtQ3H6QOaHS1ALbSuO9biNhlUelBJy8bF2JQ&s" alt="oranges"></td>
            <td>Oranges</td>
            <td>$1ea.</td>
        </tr>
        <tr>
            <td><img src="" alt=" "></td>
            <td>Bananas</td>
            <td>$0.75/lb</td>
        </tr>
        <tr>
            <td><img id="anh2" border-radius: 10px width="60%" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTUEXo5N_VMppfAkCk6Mft1bWd4SzuNgpyGzA&s" alt="pomegranates"></td>
            <td>Pomegranates</td>
            <td>3 for $5</td>
        </tr>
        <tr>
            <td><img src="" alt=" "></td>
            <td>Gummy Bears</td>
            <td>$6 per bag</td>
        </tr>
        <tr>
            <td><img id="anh3" width="60%" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT--sdo3-paiH5r-kjw98G7LYCQuQRA9J3Hxw&s" alt="broccoli"></td>
            <td>Broccoli</td>
            <td>$3 a head</td>
        </tr>
    </table>

    <!-- bài 2: Tạo form đặt phòng khách sạn: -->
    <h2>Booking Form</h2>
    <form action="">
        <label for="name">Name:</label>
        <input id="name" type="text" name="name">
        <br>
        <br>
        <label for="">Email:</label>
        <input type="email" name="email">
        <br>
        <br>
        <label for="">Phone:</label>
        <input type="tel" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}">
        <br>
        <br>
        <label for="">Date:</label>
        <input type="date" name="date">
        <br>
        <br>
        <label for="">Time:</label>
        <input type="time" name="time">
        <br>
        <br>
        <label for="">Number of Guests:</label>
        <input type="number" min="0">
        <br>
        <br>
        <button>Submit</button>
    </form>

    <!-- bài 3: Tạo form mua xe -->
     <h2>Car Purchase Form</h2>
     <form action="">
        <label for="">Name:</label>
        <input type="text" name="name">
        <br>
        <br>
        <label for="">Email:</label>
        <input type="email" name="email">
        <br>
        <br>
        <label for="">Phone:</label>
        <input type="tel" name="phone">
        <br>
        <br>
        <label for="type">Choose a Car</label>
        <select name="type" id="type">
            <option value="">Model1</option>
            <option value="">Model2</option>
            <option value="">Model3</option>
        </select>
        <br>
        <br>
        <label for="color">Choose a Color</label>
        <select name="color" id="color">
            <option value="Red">Red</option>
            <option value="Blue">Blue</option>
            <option value="Black">Black</option>
            <option value="White">White</option>
        </select>
        <br>
        <br>
        <label for="">Quantity</label>
        <input type="text" name="Quantity">
        <br>
        <br>
        <label for="">Delivery Date</label>
        <input type="date" name="delivery_date">
        <br>
        <br>
        <button>Submit</button>
     </form>

</body>
</html>
